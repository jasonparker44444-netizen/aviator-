<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:20px}
input,button{padding:15px;width:90%;margin:10px;font-size:18px;border-radius:10px;border:none}
button{background:#f8e16c;font-weight:bold;color:#000}
.bet{background:#0ab80a;color:#fff}
#status{background:#222;padding:10px;border-radius:8px;margin-top:10px;font-size:14px;word-break:break-all}
</style></head><body>
<h2>AVIATOR FLY</h2>
<div style="background:#0ab80a;padding:10px;border-radius:20px" id="bal">Balance: KES 0.00</div>
<input id="phone" value="254115968876">
<input id="amount" value="100" type="number">
<button id="depBtn">DEPOSIT - STK (Till 8033859)</button>
<button class="bet" id="betBtn">BET 50</button>
<div id="status">Ready - Click Deposit</div>
<script>
console.log("JS Loaded");
document.getElementById('depBtn').addEventListener('click', async function(){
  const status=document.getElementById('status');
  status.innerText='Button Pressed! Sending STK...';
  alert('Button pressed! Sending to server...');
  const phone=document.getElementById('phone').value.trim();
  const amount=document.getElementById('amount').value.trim();
  console.log('Sending',phone,amount);
  try{
    const res=await fetch('/api/mpesa/stkpush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount:Number(amount)})});
    const text=await res.text();
    console.log('Response',text);
    status.innerText=text;
    try{const d=JSON.parse(text); if(d.ResponseCode==0) alert('STK SENT! Check phone!'); else alert('Error: '+text);}catch(e){alert(text);}
  }catch(e){
    console.error(e);
    status.innerText='FETCH ERROR: '+e.message;
    alert('Fetch Error: '+e.message+' - Check Render logs!');
  }
});
document.getElementById('betBtn').addEventListener('click',()=>{alert('BET works!');});
window.onerror=function(msg){document.getElementById('status').innerText='JS ERROR: '+msg; alert('JS Error: '+msg);};
</script></body></html>
