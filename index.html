<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DigitalServices Aviator - STK Ready</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#0a0e19;color:#fff;overflow:hidden}
.topbar{background:#121827;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2a40}
.topbar h2{color:#ff3b30;font-size:18px;letter-spacing:1px}
.balance-box{background:#1c2538;border-radius:20px;padding:6px 14px;display:flex;gap:8px;align-items:center}
.balance-box b{color:#00d26a}
.game-area{height:55vh;background:linear-gradient(to bottom,#0f192e 0%, #1a2a4a 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#multiplier{font-size:64px;font-weight:900;color:#fff;z-index:2;text-shadow:0 0 20px rgba(255,59,48,.6)}
#plane{position:absolute;left:10%;bottom:20%;font-size:40px;transition:all 0.1s linear;z-index:1}
.crash-line{position:absolute;bottom:0;left:0;height:3px;background:#ff3b30;width:0%;z-index:3}
.controls{padding:16px;background:#121827}
.bet-card{background:#1c2538;border-radius:16px;padding:16px;margin-bottom:12px}
.bet-card label{font-size:11px;opacity:.6;letter-spacing:1px}
.bet-inputs{display:flex;gap:10px;margin:10px 0}
.bet-inputs input{flex:1;background:#0a0e19;border:1px solid #2a3a50;border-radius:10px;padding:14px;color:#fff;font-size:18px;font-weight:bold;text-align:center}
.quick{display:flex;gap:6px}
.quick button{background:#2a3a50;border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px}
.bet-btn{width:100%;background:#00d26a;color:#000;font-weight:900;padding:16px;border:none;border-radius:12px;font-size:18px;margin-top:10px;cursor:pointer}
.bet-btn.cashout{background:#ff9f00}
.deposit-bar{position:fixed;bottom:0;left:0;right:0;background:#121827;padding:12px 16px;border-top:1px solid #1e2a40;display:flex;gap:10px}
.deposit-bar input{flex:1;background:#0a0e19;border:1px solid #2a3a50;border-radius:10px;padding:12px;color:#fff}
.deposit-bar button{background:#00d26a;color:#000;font-weight:800;border:none;border-radius:10px;padding:12px 20px;cursor:pointer}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.active{display:flex}
.modal-box{background:#1c2538;width:100%;max-width:380px;border-radius:20px;padding:24px}
.modal-box h3{text-align:center;margin-bottom:16px}
.modal-box input{width:100%;background:#0a0e19;border:1px solid #2a3a50;border-radius:12px;padding:14px;color:#fff;margin:8px 0;font-size:16px}
.pay-btn{width:100%;background:#00d26a;color:#000;font-weight:900;padding:16px;border:none;border-radius:12px;font-size:18px;margin-top:12px;cursor:pointer}
.pay-btn:disabled{background:#555}
.status-box{margin-top:12px;padding:12px;border-radius:10px;text-align:center;display:none;font-size:14px}
.status-box.show{display:block}
.success{background:rgba(0,210,106,.15);color:#00d26a}
.error{background:rgba(255,59,48,.15);color:#ff3b30}
.loading{background:rgba(255,193,7,.15);color:#ffc107}
.amt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.amt-grid button{background:#2a3a50;border:none;color:#fff;padding:10px;border-radius:8px}
</style>
</head>
<body>

<div class="topbar">
  <h2>✈️ DIGITAL SERVICES AVIATOR</h2>
  <div class="balance-box">BAL <b id="bal">KES 10.00</b></div>
</div>

<div class="game-area">
  <div id="multiplier">1.00x</div>
  <div id="plane">✈️</div>
  <div class="crash-line" id="line"></div>
</div>

<div class="controls">
  <div class="bet-card">
    <label>BET AMOUNT</label>
    <div class="bet-inputs">
      <input type="number" id="betAmt" value="10" min="10">
      <div class="quick">
        <button onclick="addBet(-10)">-</button>
        <button onclick="addBet(10)">+</button>
        <button onclick="setBet(50)">50</button>
        <button onclick="setBet(100)">100</button>
      </div>
    </div>
    <button class="bet-btn" id="betBtn" onclick="placeBet()">BET - KES 10</button>
  </div>
</div>

<div class="deposit-bar">
  <input type="tel" id="quickPhone" placeholder="07XX">
  <input type="number" id="quickAmt" placeholder="100" value="100" style="max-width:90px">
  <button onclick="openDeposit()">DEPOSIT</button>
</div>

<!-- DEPOSIT MODAL WITH STK -->
<div class="modal" id="depositModal">
  <div class="modal-box">
    <h3>💰 Deposit via M-Pesa STK</h3>
    <p style="text-align:center;font-size:12px;opacity:.6;margin-bottom:10px">Channel 14591 • Account 13469 • digitalservices</p>
    
    <label style="font-size:11px;opacity:.6">M-PESA NUMBER</label>
    <input type="tel" id="mpesaPhone" placeholder="07XXXXXXXX" value="">

    <label style="font-size:11px;opacity:.6">AMOUNT</label>
    <input type="number" id="depAmount" value="100" min="10">

    <div class="amt-grid">
      <button onclick="setDep(50)">50</button>
      <button onclick="setDep(100)">100</button>
      <button onclick="setDep(200)">200</button>
      <button onclick="setDep(500)">500</button>
    </div>

    <button class="pay-btn" id="stkBtn" onclick="sendSTK()">SEND STK PUSH NOW</button>

    <div class="status-box" id="stkStatus"></div>

    <button onclick="closeDeposit()" style="width:100%;background:transparent;border:none;color:#fff;opacity:.5;margin-top:12px;padding:10px">Close</button>
  </div>
</div>

<script>
// Balance
let balance = 10.00;
function updateBal(){ document.getElementById('bal').innerText = 'KES '+balance.toFixed(2) }

// Aviator simple animation
let mult = 1.00, flying=false, crashAt=0, interval;
function placeBet(){
  if(flying) return;
  const bet = parseInt(document.getElementById('betAmt').value);
  if(bet>balance){ alert('Low balance! Deposit first'); openDeposit(); return; }
  balance-=bet; updateBal();
  flying=true; mult=1.00; crashAt = (Math.random()*8+1.2).toFixed(2);
  document.getElementById('betBtn').innerText='FLYING...'; document.getElementById('betBtn').className='bet-btn cashout';
  document.getElementById('betBtn').onclick=cashout;
  interval=setInterval(()=>{
    mult+=0.03 + mult*0.01;
    document.getElementById('multiplier').innerText=mult.toFixed(2)+'x';
    document.getElementById('plane').style.left = (10+mult*3)+'%';
    document.getElementById('plane').style.bottom = (20+mult*5)+'%';
    document.getElementById('line').style.width = (mult*8)+'%';
    if(mult>=crashAt){ crash(); }
  },100);
}
function cashout(){
  clearInterval(interval); flying=false;
  let win = parseInt(document.getElementById('betAmt').value)*mult;
  balance+=win; updateBal(); resetGame(`CASHED ${mult.toFixed(2)}x Won ${win.toFixed(0)}`);
}
function crash(){
  clearInterval(interval); flying=false;
  document.getElementById('multiplier').innerText='CRASHED @ '+crashAt+'x';
  document.getElementById('multiplier').style.color='#ff3b30';
  setTimeout(resetGame,2000);
}
function resetGame(msg){
  document.getElementById('multiplier').style.color='#fff';
  document.getElementById('multiplier').innerText='1.00x';
  document.getElementById('plane').style.left='10%'; document.getElementById('plane').style.bottom='20%';
  document.getElementById('line').style.width='0%';
  document.getElementById('betBtn').innerText='BET - KES '+document.getElementById('betAmt').value;
  document.getElementById('betBtn').className='bet-btn';
  document.getElementById('betBtn').onclick=placeBet;
  if(msg) setTimeout(()=>alert(msg),200);
}
function addBet(v){ let i=document.getElementById('betAmt'); i.value=Math.max(10,parseInt(i.value)+v); document.getElementById('betBtn').innerText='BET - KES '+i.value }
function setBet(v){ document.getElementById('betAmt').value=v; document.getElementById('betBtn').innerText='BET - KES '+v }

// DEPOSIT MODAL
function openDeposit(){ document.getElementById('depositModal').classList.add('active'); document.getElementById('mpesaPhone').value=document.getElementById('quickPhone').value; document.getElementById('depAmount').value=document.getElementById('quickAmt').value||100 }
function closeDeposit(){ document.getElementById('depositModal').classList.remove('active') }
function setDep(v){ document.getElementById('depAmount').value=v }

async function sendSTK(){
  const phone=document.getElementById('mpesaPhone').value.trim();
  const amount=document.getElementById('depAmount').value.trim();
  const btn=document.getElementById('stkBtn');
  const st=document.getElementById('stkStatus');
  if(phone.length<10){ alert('Enter 07... number'); return; }
  if(amount<10){ alert('Min 10'); return; }
  btn.disabled=true; btn.innerText='SENDING STK...';
  st.className='status-box show loading'; st.innerText='⏳ Sending STK Push to '+phone+'... Check phone and enter PIN';
  try{
    const res=await fetch('/api/deposit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone,amount,user_id:'user_'+phone})
    });
    const data=await res.json();
    console.log(data);
    if(data.success){
      st.className='status-box show success';
      st.innerHTML=`✅ <b>STK PUSH SENT!</b><br>To: ${phone}<br>Amount: KES ${amount}<br><br>Check your phone<br>Enter M-Pesa PIN<br><br>Ref: ${data.data?.reference||data.data?.CheckoutRequestID||'pending'}`;
      btn.innerText='STK SENT ✓';
      // Simulate balance update after 5 sec for demo (real will come from callback)
      setTimeout(()=>{ balance+=parseInt(amount); updateBal(); st.innerHTML+='<br><br>💰 Balance updated!'; },8000);
    } else {
      st.className='status-box show error';
      st.innerText='❌ Failed: '+(data.error?.message||JSON.stringify(data.error)||data.msg);
      btn.disabled=false; btn.innerText='SEND STK PUSH NOW';
    }
  } catch(e){
    st.className='status-box show error'; st.innerText='Error: '+e.message;
    btn.disabled=false; btn.innerText='SEND STK PUSH NOW';
  }
}
updateBal();
</script>
</body>
</html>
