<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVIATOR FLY</title>
<style>
  body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:20px;margin:0}
  h2{color:#7ef9ff;letter-spacing:2px}
  .bal{background:#0f9d0f;padding:12px;border-radius:25px;font-weight:bold;margin:10px 0}
  input{width:90%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px}
  .btn-yellow{background:#f7c948;color:#000;padding:14px;width:92%;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin:8px 0}
  .btn-green{background:#00d100;color:#fff;padding:14px;width:92%;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin:8px 0}
  #log{margin-top:15px;background:#222;padding:10px;border-radius:10px;font-size:13px;min-height:20px;word-break:break-all}
  #plane{font-size:60px;margin:20px}
</style>
</head>
<body>
<h2>AVIATOR FLY</h2>
<div class="bal" id="balance">Balance: KES 0.00</div>
<div id="plane">✈️ <span id="mult">1.00x</span></div>

<input id="phone" placeholder="2547XXXXXXXX" value="254115968876">
<input id="amount" type="number" placeholder="Amount" value="100">

<button class="btn-yellow" id="depositBtn" onclick="doDeposit()">DEPOSIT - STK (Till 8033859)</button>
<button class="btn-green" onclick="doBet()">BET 50</button>

<div id="log">Ready - Click Deposit</div>

<script>
let bal = 0;
const logEl = document.getElementById('log');
const balEl = document.getElementById('balance');

function log(t){ logEl.innerText = t; console.log(t); }

async function refreshBal(){
  try{
    const r = await fetch('/api/balance');
    const d = await r.json();
    bal = d.balance || 0;
    balEl.innerText = `Balance: KES ${bal.toFixed(2)}`;
  }catch(e){}
}
refreshBal();
setInterval(refreshBal, 3000);

async function doDeposit(){
  const phone = document.getElementById('phone').value.trim();
  const amount = document.getElementById('amount').value.trim();
  if(!phone || !amount){ alert('Enter phone and amount'); return; }
  log(`Sending STK ${amount} to ${phone}... Wait 30s wake up if first time`);
  document.getElementById('depositBtn').disabled = true;
  try{
    const res = await fetch('/api/deposit', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ phone, amount })
    });
    const data = await res.json();
    console.log(data);
    if(data.ResponseCode === '0' || data.ResponseDescription){
      log('✅ STK Sent! Check your phone for M-Pesa prompt. Enter PIN.');
    } else if(data.error){
      log('❌ Error: ' + JSON.stringify(data.error).slice(0,200));
    } else {
      log('Response: ' + JSON.stringify(data).slice(0,300));
    }
  }catch(err){
    log('❌ Network Error: ' + err.message + ' - Render may be sleeping, wait 30s and try again');
  }
  document.getElementById('depositBtn').disabled = false;
}

function doBet(){
  if(bal < 50){ log('Low balance - Deposit first'); return; }
  log('Bet placed! (game logic here)');
  // simple demo
  let m = 1.00;
  const iv = setInterval(()=>{
    m+=0.05;
    document.getElementById('mult').innerText = m.toFixed(2)+'x';
    if(m>3){ clearInterval(iv); bal+=50*(m-1); balEl.innerText = `Balance: KES ${bal.toFixed(2)}`; log(`Won! Multiplier ${m.toFixed(2)}x`); }
  },100);
}

// Aviator animation
setInterval(()=>{
  document.getElementById('mult').innerText = (1+Math.random()*2).toFixed(2)+'x';
},2000);
</script>
</body>
</html>
