<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIATOR FLY</title>
<style>
body{background:#0f1420;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;padding:10px}
.header,.balance,.controls{width:100%;max-width:400px;border-radius:12px;padding:12px;margin-bottom:8px}
.header{background:#23333;text-align:center;font-weight:bold;font-size:18px}
.balance{background:#00c853;text-align:center;font-weight:bold}
.controls{background:#1e2a3d;padding:15px;border-radius:12px}
.plane{font-size:50px;text-align:center;animation:float 1.5s infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.mult{font-size:40px;color:#febb2b;text-align:center;font-weight:bold}
.input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;font-size:16px}
.bet-btn{width:100%;padding:14px;background:#00c676;font-weight:bold;border:none;border-radius:8px;font-size:18px}
.deposit-btn{width:100%;padding:14px;background:#febb2b;font-weight:bold;border:none;border-radius:8px;margin-top:6px}
.status{text-align:center;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header">AVIATOR FLY</div>
<div class="balance" id="balance">Balance: KES 0.00</div>
<div class="controls">
<div class="plane">✈️</div>
<div class="mult" id="mult">1.00x</div>
<input id="betAmount" class="input" type="number" value="50">
<button class="bet-btn" id="betBtn">BET</button>
<input id="phone" class="input" type="text" value="2547" placeholder="2547XXXXXXXX">
<input id="depAmount" class="input" type="number" value="100">
<button class="deposit-btn" onclick="deposit()">DEPOSIT - STK (Till 8033859)</button>
<div class="status" id="status"></div>
</div>

<script>
async function deposit(){
  const phone = document.getElementById('phone').value.trim();
  const amount = document.getElementById('depAmount').value.trim();
  const status = document.getElementById('status');
  
  if(!phone.startsWith('254') || phone.length < 12){
    status.innerText = 'Error: Use 2547XXXXXXXX';
    return;
  }
  
  status.innerText = 'Sending STK to ' + phone + '...';
  status.style.color = '#febb2b';
  
  try{
    const res = await fetch('/stk-push', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone, amount: Number(amount)})
    });
    
    const text = await res.text();
    console.log('RAW:', text);
    
    let data;
    try{
      data = JSON.parse(text);
    }catch(e){
      status.innerText = 'Server Error: ' + text.substring(0,100);
      console.error(text);
      return;
    }
    
    if(data.success){
      status.innerText = data.message;
      status.style.color = '#00ff00';
      alert('STK Sent! Check phone ' + phone);
    } else {
      status.innerText = data.message;
      status.style.color = '#ff4444';
    }
  }catch(err){
    status.innerText = 'Error: ' + err.message;
    console.error(err);
  }
}
</script>
</body>
</html>
