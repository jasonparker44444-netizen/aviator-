<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalServices</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}
body{background:#0a0e19;color:#fff;min-height:100vh}
.header{background:#121827;padding:16px;text-align:center;border-bottom:1px solid #1e2a40}
.header h1{color:#00d26a;font-size:22px;letter-spacing:1px}
.sub{font-size:11px;opacity:.5;margin-top:4px}
.container{max-width:400px;margin:0 auto;padding:20px}
.card{background:#1c2538;border-radius:20px;padding:24px;margin-top:20px}
.card h2{text-align:center;margin-bottom:16px;font-size:18px}
label{font-size:11px;opacity:.6;letter-spacing:1px;display:block;margin-top:12px}
input{width:100%;background:#0a0e19;border:1px solid #2a3a50;border-radius:12px;padding:14px;color:#fff;font-size:16px;margin-top:6px}
.amt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.amt-grid button{background:#2a3a50;border:none;color:#fff;padding:12px;border-radius:10px;font-weight:600;cursor:pointer}
.amt-grid button:hover{background:#3a4a60}
.pay-btn{width:100%;background:#00d26a;color:#000;font-weight:900;padding:16px;border:none;border-radius:12px;font-size:18px;margin-top:16px;cursor:pointer}
.pay-btn:disabled{background:#555;color:#999}
.status{margin-top:16px;padding:14px;border-radius:12px;text-align:center;display:none;font-size:14px;line-height:1.5}
.status.show{display:block}
.success{background:rgba(0,210,106,.15);color:#00d26a;border:1px solid rgba(0,210,106,.3)}
.error{background:rgba(255,59,48,.15);color:#ff6b6b;border:1px solid rgba(255,59,48,.3)}
.loading{background:rgba(255,193,7,.15);color:#ffcc00;border:1px solid rgba(255,193,7,.3)}
.bal-card{background:#121827;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.bal-card b{color:#00d26a;font-size:18px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#121827;padding:12px;text-align:center;font-size:10px;opacity:.4;border-top:1px solid #1e2a40}
</style>
</head>
<body>

</div>

    <div class="amt-grid">

      <button onclick="setAmt(100)">100</button>
      <button onclick="setAmt(200)">200</button>
      <button onclick="setAmt(500)">500</button>
    </div>

    <button class="pay-btn" id="btn" onclick="sendSTK()">SEND STK PUSH</button>

    <div class="status" id="status"></div>
  </div>
</div>

<div class="footer">digitalservices • Powered by PayHero • Account 2057751390</div>
