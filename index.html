<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIATOR FLY</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}
.box{background:#222;max-width:400px;margin:20px auto;padding:20px;border-radius:15px}
input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
button{width:92%;padding:13px;border-radius:8px;border:none;font-size:16px;font-weight:bold;cursor:pointer}
.bet{background:#22c55e;color:#fff}
.dep{background:#facc15;color:#000;margin-top:10px}
.bal{background:#22c55e;padding:10px;border-radius:8px;margin-bottom:15px}
#mult{font-size:32px;color:orange;margin:15px 0}
#log{font-size:12px;color:#aaa;white-space:pre-wrap;margin-top:10px;max-height:150px;overflow:auto;background:#000;padding:5px;border-radius:5px}
</style>
</head>
<body>

<div class="box">
<h2>AVIATOR FLY</h2>
<div class="bal" id="bal">Balance: KES 0.00</div>
<div style="font-size:40px">✈️</div>
<div id="mult">1.00x</div>

<input id="betAmount" value="50" type="number" placeholder="Bet Amount">
<button class="bet" onclick="placeBet()">BET</button>

<hr style="margin:15px 0;border-color:#333">

<input id="phone" value="254115968876" placeholder="2547XXXXXXXX">
<input id="amount" value="100" type="number" placeholder="Deposit Amount">
<button class="dep" onclick="deposit()">DEPOSIT - STK (Till 8033859)</button>

<div id="log"></div>
</div>

<script>
let balance = 0;
let isFlying = false;
let mult = 1.00;

function placeBet(){
  const bet = parseFloat(document.getElementById('betAmount').value);
  if(bet > balance){ log('Low balance! Deposit first'); return; }
  if(isFlying) return;
  balance -= bet;
  updateBal();
  isFlying = true;
  mult = 1.00;
  let crashAt = (Math.random()*5 + 1).toFixed(2);
  log('Bet '+bet+' - Crash at '+crashAt+'x');
  let interval = setInterval(()=>{
    mult += 0.05;
    document.getElementById('mult').innerText = mult.toFixed(2)+'x';
    if(mult >= crashAt){
      clearInterval(interval);
      isFlying = false;
      document.getElementById('mult').innerText = 'CRASHED @ '+crashAt+'x';
      log('Crashed @ '+crashAt+'x');
    }
  },100);
}

function updateBal(){
  document.getElementById('bal').innerText = 'Balance: KES '+balance.toFixed(2);
}

function log(t){
  document.getElementById('log').innerText = t + '\n' + document.getElementById('log').innerText;
}

async function deposit(){
  const phone = document.getElementById('phone').value.trim();
  const amount = document.getElementById('amount').value.trim();
  if(!phone){ alert('Enter phone'); return; }
  log('Sending STK to '+phone+' KES '+amount+' ...');
  try{
    const res = await fetch('/stkpush',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({phone: phone, amount: amount})
    });
    const data = await res.json();
    log('RESP: '+JSON.stringify(data));
    if(data.ResponseCode === '0' || data.ResponseCode === 0){
      alert('STK PUSH SENT! Check '+phone+' and enter PIN');
    } else {
      alert('Mpesa says: '+JSON.stringify(data));
    }
  }catch(e){
    log('ERROR: '+e.message);
    alert('Server Error: '+e.message);
  }
}
</script>
</body>
</html>
