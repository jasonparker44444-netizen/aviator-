<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalServices</title><style>body{background:#0a0e19;color:#fff;font-family:Arial;text-align:center;padding:40px} .card{background:#1c2538;border-radius:20px;padding:24px;max-width:360px;margin:40px auto} input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2a3a50;background:#0a0e19;color:#fff} button{width:100%;padding:16px;background:#00d26a;color:#000;font-weight:900;border:none;border-radius:12px;font-size:18px} </style></head><body><h1 style="color:#00d26a">DIGITAL SERVICES</h1><p>Channel 14591 • Account 13469</p><div class="card"><input id="phone" placeholder="07XXXXXXXX"><input id="amount" type="number" value="100"><button onclick="deposit()">SEND STK PUSH</button><p id="status"></p></div><script>async function deposit(){const p=document.getElementById('phone').value, a=document.getElementById('amount').value; const s=document.getElementById('status'); s.innerText='Sending...'; const r=await fetch('/api/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,amount:a})}); const d=await r.json(); s.innerText=JSON.stringify(d,null,2);}</script></body></html>
