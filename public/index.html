<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalServices - Spin & Win</title><style>
body{background:#0a0e19;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#1c2538;border-radius:20px;padding:24px;max-width:360px;margin:20px auto}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2a3a50;background:#0a0e19;color:#fff;box-sizing:border-box}
.btn-green{width:100%;padding:16px;background:#00d26a;color:#000;font-weight:900;border:none;border-radius:12px;font-size:18px;cursor:pointer}
.btn-yellow{width:100%;padding:16px;background:#ffeb3b;color:#000;font-weight:900;border:none;border-radius:12px;font-size:18px;margin-top:10px;cursor:pointer;display:none}
.wheel{font-size:110px;transition:transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);margin:10px 0}
#prize{color:#00d26a;font-size:22px;font-weight:900;min-height:30px}
#status{font-size:13px;white-space:pre-wrap;color:#9aa8c0}
.badge{background:#00d26a22;border:1px solid #00d26a;color:#00d26a;padding:6px 12px;border-radius:20px;font-size:12px}
</style></head><body>

<h1 style="color:#00d26a;margin-bottom:0">DIGITAL SERVICES</h1>
<p><span class="badge">🎡 SPIN & WIN AIRTIME</span></p>
<p style="color:#9aa8c0;font-size:13px">Channel 14591 • Account 13469</p>

<div class="card">
<div id="wheel" class="wheel">🎡</div>
<div id="prize">SPIN TO WIN BUNDLES</div>
<p style="font-size:12px;color:#9aa8c0">Prizes: 2GB, 3GB, 4GB, 5GB, 100KES, 2GB Airtime</p>

<input id="phone" placeholder="Phone 07XXXXXXXX or 2547XXXXXXXX">
<input id="amount" type="number" value="10" min="100">
<button class="btn-green" id="buyBtn" onclick="deposit()">BUY SPIN TICKET - STK PUSH</button>
<button class="btn-yellow" id="spinBtn" onclick="spin()">🎡 SPIN NOW!</button>
<p id="status">Buy ticket for 100 KES to unlock spin</p>
</div>

<script>
let canSpin = false;
const prizes = ["2GB DATA","5GB DATA","100 KES ","10GB DATA","800 KES ","5GB DATA","2GB DATA","500KES "];
let isPaid = false;

async function deposit(){
 const p=document.getElementById('phone').value.trim();
 const a=document.getElementById('amount').value;
 const s=document.getElementById('status');
 const buyBtn=document.getElementById('buyBtn');
 const spinBtn=document.getElementById('spinBtn');
 
 if(p.length < 10){ s.innerText='Enter valid phone e.g 07...'; return; }
 
 s.innerText='Sending STK Push via PayHero Channel 14591... Check your phone';
 buyBtn.innerText='SENDING...';
 buyBtn.disabled=true;

 try{
  const r=await fetch('/api/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,amount:a})});
  const d=await r.json();
  s.innerText='STK SENT! Enter M-Pesa PIN on phone. After payment, SPIN button will appear.\n\n'+JSON.stringify(d).slice(0,200);
  
  // For PayHero you must wait for callback, but for UX we unlock spin after STK sent
  // Change to true only after callback if you want strict
  isPaid = true;
  buyBtn.style.display='none';
  spinBtn.style.display='block';
  canSpin=true;
 }catch(e){
  s.innerText='Error: '+e.message+'\nCheck server logs on Render';
  buyBtn.innerText='BUY SPIN TICKET - STK PUSH';
  buyBtn.disabled=false;
 }
}

function spin(){
 if(!canSpin){ alert("Buy Spin Ticket First!"); return; }
 const deg = 1800 + Math.random()*1500;
 document.getElementById("wheel").style.transform = `rotate(${deg}deg)`;
 document.getElementById("prize").innerText = "SPINNING...";
 document.getElementById("spinBtn").disabled=true;
 
 setTimeout(()=>{
   const win = prizes[Math.floor(Math.random()*prizes.length)];
   document.getElementById("prize").innerText = "YOU WON: " + win + " 🎉";
   document.getElementById("status").innerText = "Congrats! You won "+win+"! Buy another ticket to spin again.";
   document.getElementById("spinBtn").style.display='none';
   document.getElementById("buyBtn").style.display='block';
   document.getElementById("buyBtn").innerText='BUY AGAIN - SPIN AGAIN';
   document.getElementById("buyBtn").disabled=false;
   canSpin=false;
   isPaid=false;
 },4000);
}
</script>
</body></html>
